[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "media-diff"
dynamic = ["version"]
description = "Local web tool for side-by-side image and video comparison"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "WZMIAOMIAO" }]
keywords = ["image", "video", "comparison", "diff", "fastapi", "ffmpeg"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "fastapi>=0.115.0",
    "imageio-ffmpeg>=0.6.0",
    "numpy>=1.24.0",
    "pillow>=10.0.0",
    "pydantic>=2.0.0",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0.0", "httpx>=0.27.0"]

[project.scripts]
media-diff = "media_diff.cli:main"

[tool.hatch.version]
path = "media_diff/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["media_diff"]

[tool.hatch.build.targets.sdist]
include = [
    "media_diff",
    "frontend/src",
    "frontend/public",
    "frontend/index.html",
    "frontend/package.json",
    "frontend/package-lock.json",
    "frontend/tsconfig*.json",
    "frontend/vite.config.ts",
    "frontend/.oxlintrc.json",
    "tests",
    "doc",
    "assets",
    "README.md",
    "LICENSE",
    "CONTRIBUTING.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
